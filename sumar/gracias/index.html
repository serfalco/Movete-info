  <style>
    .sumar-page main { padding-top: 28px; max-width: 760px; }
    .sumar-panel { padding: clamp(22px, 4vw, 40px); border: 1px solid var(--line); border-radius: 28px; background: var(--card); margin: 14px 0 28px; }
    .sumar-panel h1 { font-size: clamp(2.6rem, 7vw, 4.6rem); line-height: .9; margin: 8px 0 14px; }
    .sumar-lead { margin: 0 0 24px; font-size: 1.08rem; line-height: 1.5; color: color-mix(in srgb, var(--ink) 78%, transparent); }
    .sumar-form { display: grid; gap: 16px; }
    .sumar-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .sumar-form label { display: grid; gap: 6px; font-family: var(--font-action); font-weight: 700; font-size: .98rem; }
    .sumar-form label small { font-family: var(--font-body); font-weight: 400; color: var(--muted); font-size: .86rem; }
    .sumar-form input, .sumar-form select { font: inherit; font-family: var(--font-body); font-weight: 400; font-size: 1rem; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--paper); color: var(--ink); width: 100%; box-sizing: border-box; }
    .sumar-form input:focus, .sumar-form select:focus { outline: 2px solid var(--accent2); outline-offset: 1px; }
    .sumar-trampa { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .sumar-form button { justify-self: start; font-size: 1.05rem; cursor: pointer; }
    .sumar-nota { font-size: .9rem; color: var(--muted); margin: 4px 0 0; line-height: 1.45; }
    .sumar-error { padding: 12px 16px; border-radius: 12px; border: 1px solid var(--accent); color: var(--accent-text); margin: 0 0 18px; font-weight: 700; }
    .sumar-error[hidden] { display: none; }
    @media (max-width: 560px) { .sumar-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="sumar-page">
