name: Pre-edicion martes

on:
  schedule:
    # Martes 04:00 Argentina (07:00 UTC). GitHub puede demorar los cron varias horas.
    # Para el martes los teatros (Teatro Cerca) y las boleterias ya cargaron casi toda
    # la semana siguiente. Dos cosas:
    #  1. Pasada intermedia: entran los shows nuevos en la portada de En Vivo,
    #     rubros, salas, obras, hoy y finde. NO se reescribe la edicion fechada
    #     vigente (/en-vivo/<jueves pasado>/): queda como la publico el jueves.
    #  2. Pre-edicion: la edicion fechada del proximo jueves sale como URL propia
    #     para que Google la descubra antes. El jueves la corrida completa
    #     (Publicar semanal) la reemplaza con cine y el resto.
    # Es una de las tres pasadas de la semana: martes, jueves y domingo.
    - cron: "0 7 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Mismo grupo que las otras corridas: nunca se pisan al hacer push.
  group: publicar-movete
  cancel-in-progress: false

jobs:
  preedicion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Movete-info
        uses: actions/checkout@v4
        with:
          ref: main
          path: Movete-info

      - name: Checkout movete-scraper
        uses: actions/checkout@v4
        with:
          repository: serfalco/movete-scraper
          path: movete-scraper

      - name: Checkout movete-espectaculos
        uses: actions/checkout@v4
        with:
          repository: serfalco/movete-espectaculos
          path: movete-espectaculos

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del scraper
        working-directory: movete-scraper
        run: pip install -r requirements.txt Pillow  # Pillow: copias livianas de imagenes

      - name: Calcular el proximo jueves
        id: jueves
        run: |
          # Un martes (o cualquier dia) "next thursday" es el jueves siguiente.
          echo "fecha=$(TZ=America/Argentina/Buenos_Aires date -d 'next thursday' +%F)" >> "$GITHUB_OUTPUT"

      - name: Generar eventos.json
        id: scraper
        working-directory: movete-scraper
        env:
          SALIDA_JSON: ../movete-espectaculos/eventos.json
          MOVETE_CACHE_DIR: ../Movete-info/data/scraper-cache
          MOVETE_ALERTA: ${{ github.workspace }}/_alerta.txt
        run: python main.py

      - name: Actualizar lo vigente sin tocar la edicion fechada
        working-directory: movete-espectaculos
        run: python generar_edicion.py --eventos eventos.json --output ../Movete-info/en-vivo --sin-fechada

      - name: Generar pre-edicion fechada
        working-directory: movete-espectaculos
        run: |
          python generar_edicion.py --eventos eventos.json \
            --output ../Movete-info/en-vivo \
            --hoy "${{ steps.jueves.outputs.fecha }}" --solo-fechada

      - name: Actualizar portada
        working-directory: Movete-info
        run: python actualizar_portada.py

      - name: Commit en Movete-info
        working-directory: Movete-info
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && echo "Sin cambios para publicar" || git commit -m "Pasada del martes y pre-edicion MoVeTe ${{ steps.jueves.outputs.fecha }}"
          git pull --rebase origin main
          git push

      - name: Avisar si la cartelera salio incompleta
        if: always() && steps.scraper.outcome == 'success'
        run: |
          if [ -f "$GITHUB_WORKSPACE/_alerta.txt" ]; then
            echo "::error::$(head -1 "$GITHUB_WORKSPACE/_alerta.txt")"
            cat "$GITHUB_WORKSPACE/_alerta.txt"
            exit 1
          fi
          echo "Pre-edicion publicada: ninguna fuente troncal se cayo."
