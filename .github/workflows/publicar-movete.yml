name: Publicar semanal

# La edicion sale el miercoles a la noche: el jueves 00:30 Argentina (03:30
# UTC), asi el jueves a la mañana ya esta en linea y Google la ve antes.
# A esa hora ya es jueves tambien en UTC, que es la fecha que usa el runner
# para saber de que semana es la edicion (jueves_de_edicion).
#
# Lo que ya NO hace este workflow (21/11/2026), para que una demora no
# arrastre todo lo demas:
#  - Cine: "Publicar Cine", jueves 10:00. El Dia carga la cartelera nueva el
#    jueves a la mañana; a la medianoche todavia esta la de la semana pasada.
#  - Newsletter: "Enviar newsletter", jueves 09:00. Lee la cartelera que este
#    workflow deja en data/eventos-semana.json.
#
# GitHub demora los cron hasta varias horas (el 19/11/2026: 9 horas). El
# Worker movete-horarios de Cloudflare dispara este workflow a horario; el
# cron de abajo queda de respaldo. Si corren los dos, la segunda corrida
# espera a la primera (concurrency) y regenera lo mismo.

on:
  schedule:
    - cron: "30 3 * * 4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-movete
  cancel-in-progress: false

jobs:
  publicar-semanal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Movete-info
        uses: actions/checkout@v4
        with:
          ref: main
          path: Movete-info

      - name: Checkout movete-scraper
        uses: actions/checkout@v4
        with:
          repository: serfalco/movete-scraper
          path: movete-scraper

      - name: Checkout movete-espectaculos
        uses: actions/checkout@v4
        with:
          repository: serfalco/movete-espectaculos
          path: movete-espectaculos

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de En vivo
        working-directory: movete-scraper
        run: pip install -r requirements.txt Pillow  # Pillow: copias livianas de imagenes

      - name: Generar eventos.json
        id: scraper
        working-directory: movete-scraper
        env:
          SALIDA_JSON: ../movete-espectaculos/eventos.json
          MOVETE_CACHE_DIR: ../Movete-info/data/scraper-cache
          # Si una fuente troncal se cae, main.py deja el aviso aca.
          MOVETE_ALERTA: ${{ github.workspace }}/_alerta.txt
        run: python main.py

      - name: Generar En vivo
        working-directory: movete-espectaculos
        run: python generar_edicion.py --eventos eventos.json --output ../Movete-info/en-vivo

      - name: Instalar ffmpeg (para el Reel)
        # Las imagenes nuevas de ubuntu-latest ya no lo traen ("[reel] falta
        # ffmpeg" el 12/11/2026). Si falla, la edicion se publica igual.
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Armar piezas para redes
        # Carrusel del finde e historias de cada dia en Movete-info/redes/<jueves>/.
        # Solo dibuja: publica redes.yml. Si falla, la edicion sale igual.
        continue-on-error: true
        working-directory: movete-espectaculos
        run: python generar_redes.py --eventos eventos.json --salida ../Movete-info/redes --afiches ../Movete-info/assets/afiches

      - name: Actualizar fecha de portada
        working-directory: Movete-info
        run: python actualizar_portada.py

      - name: Guardar la cartelera para el newsletter
        # El newsletter sale aparte, el jueves a la mañana, y lee este archivo
        # en vez de volver a scrapear.
        run: cp movete-espectaculos/eventos.json Movete-info/data/eventos-semana.json

      - name: Commit unico en Movete-info
        working-directory: Movete-info
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && echo "Sin cambios para publicar" || git commit -m "Publicar edicion semanal MoVeTe"
          git push

      - name: Avisar a Bing de las paginas nuevas (IndexNow)
        # Google no lo usa; Bing y DuckDuckGo si. Nunca corta la publicacion.
        continue-on-error: true
        working-directory: Movete-info
        run: python avisar_indexnow.py

      - name: Avisar si la cartelera salio incompleta
        # Va ULTIMO y a proposito: la edicion ya se publico. Este paso solo
        # pone la corrida en rojo, que es lo unico que hace que GitHub mande
        # un mail. Un ::warning:: queda enterrado en la pestana Actions y
        # nadie lo ve: asi pasamos dos semanas (27/08 y 03/09 de 2026)
        # publicando media cartelera sin enterarnos.
        if: always() && steps.scraper.outcome == 'success'
        run: |
          if [ -f "$GITHUB_WORKSPACE/_alerta.txt" ]; then
            echo "::error::$(head -1 "$GITHUB_WORKSPACE/_alerta.txt")"
            cat "$GITHUB_WORKSPACE/_alerta.txt"
            exit 1
          fi
          echo "Cartelera completa: ninguna fuente troncal se cayo."
