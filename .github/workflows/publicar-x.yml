name: Publicar en X

# MoVeTe: un post por dia a las 11:00 ART con los planes del dia (redes/<jueves>/manifest.json). Se programa la noche anterior.
# Publica en X a traves de Buffer (plan gratis). Secret BUFFER_API_KEY (vence
# al año: se regenera en publish.buffer.com/settings/api). Scripts en .github/x/.
#
# GitHub dispara los cron con horas de atraso, asi que el post NO sale cuando
# corre esto: se deja programado en Buffer con la hora exacta. Corre varias
# veces por dia por las dudas; .x-estado (cache) evita programar dos veces.
#
# "Run workflow" con "prueba" tildado: muestra el texto y verifica la clave,
# sin publicar.

on:
  schedule:
    - cron: "20 0 * * *"
    - cron: "20 11 * * *"
    - cron: "20 18 * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Prueba en seco (no publica)"
        type: boolean
        default: true
      fecha:
        description: "Fecha a simular (AAAA-MM-DD, opcional)"
        required: false

permissions:
  contents: read

concurrency:
  group: publicar-x
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/x
            redes
      - name: Estado (que ya se programo)
        uses: actions/cache/restore@v4
        with:
          path: .x-estado
          key: x-estado-${{ github.run_id }}
          restore-keys: x-estado-
      - name: Publicar
        working-directory: .github/x
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          X_ESTADO: ${{ github.workspace }}/.x-estado/hechos.json
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba && '1' || '' }}
        run: |
          if [ -n "$DRY_RUN" ]; then
            python3 -c "import buffer_x,sys; sys.exit(0 if buffer_x.verificar('6af9df56ece6dfde5fd48569') else 1)" || true
          fi
          python3 movete_x.py --redes ../../redes ${{ inputs.fecha && format('--fecha {0}', inputs.fecha) || '' }}
      - name: Guardar estado
        if: always() && hashFiles('.x-estado/hechos.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .x-estado
          key: x-estado-${{ github.run_id }}
